  "limitations": [
    "Power captured for rep4 only: reps 1-3 passed a relative --logfile path to the tegrastats daemon, so no log was written (fixed with an absolute path for rep4).",
    "Single dataset, single board, same session; no thermal-stability criterion (peak GPU 62 C).",
    "D1 is R10.4.1 at 5 kHz; SoCall was trained on R9.4.1 at ~4 kHz (S). Output is about 1 base per 19.5 samples versus ~12.5 expected at 400 b/s, consistent with undercalling. Throughput and power are valid; accuracy is not, and no reference exists for D1.",
    "Wrapper (run_socall.py) and model code are private; record the wrapper by its outputs and argv. Greedy CTC runs as a per-base Python loop on the ARM CPU, a wrapper property rather than a SoCall model property.",
    "Gross module-input power (VDD_IN) averaged over the whole capture including warm-up and setup; INA3221 scaling uncalibrated; idle 3.29 W measured separately (jetson-tx2-jp466 system record).",
    "Results: per-rep 0.5077, 0.5083, 0.5121, 0.5082 M samples/s (mean 0.5091, SD 0.0020; 8 timed passes mean 0.5091, SD 0.0019, range 0.5074-0.5124) = 24.8% of the 2.05 M samples/s 4 kHz target and 19.9% of 2.56 M samples/s 5 kHz. Mean stage shares: inference 48.9%, decode 47.3%, normalize 2.1%, stitch 1.0%, transfers 0.4%. About 26,100 bases/s. Peak RSS 2,945-2,950 MiB; CUDA max allocated 109.5 MiB. Rep4 power: avg VDD_IN 8.51 W (5.22 W above idle), peak 12.39 W, GPU rail 4.18 W, CPU rail 0.78 W, GPU utilisation 43.7%, CPU 9.4%, peak RAM 3,493 MB; about 16.7 uJ/sample gross."
  ]
