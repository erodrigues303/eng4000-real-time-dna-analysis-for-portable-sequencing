  "limitations": [
    "Folded FP16 model (PyTorch/cuDNN) on all of D5. Wrapper: fold_socall.py launcher (folds BatchNorm into the convs on load and checks the fold against the unfolded model on the CPU, max abs log-prob diff < 1e-4) around run_socall_v2.py; wrapper, launcher and model code are private.",
    "One timed pass after a 50-read warm-up; FAST5 reading and pA conversion are inside the timed pass (read_io). Greedy decoding only: fast-ctc-decode has no Python 3.6 aarch64 build.",
    "PyTorch 1.10 runs these FP16 convolutions through cuDNN; an inference-only check in the same session put FP16 at 0.85x of folded FP32. The likely cause (FP32 accumulation without the Pascal half2 rate) is not verified. TensorRT FP16 is a separate study.",
    "Single board and session; no thermal-stability criterion. INA3221 scaling uncalibrated; idle 3.29 W from the jetson-tx2-jp466 system record.",
    "Paths under the run user's home directory were stripped from the published run-stats, stdout and hash files; no other bytes were changed (tegrastats logs gzipped).",
    "Results: 0.8073 M samples/s over one timed pass of all 4,467 reads (39.4% of the 2.048 M samples/s 4 kHz target). Stage shares: inference 89.7%, normalize 3.6%, read_io 3.1%, decode 1.7%. CUDA max allocation: 58.9 MiB. run 1: 12.34 W avg VDD_IN (9.05 W above idle), GPU util 88.1%;"
