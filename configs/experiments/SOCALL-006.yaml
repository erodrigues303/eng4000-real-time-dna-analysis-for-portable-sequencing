  "command": "sudo jetson_clocks; per process run: sudo tegrastats --interval 1000 --logfile <abs>/tegrastats_<tag>.log --start; python3 run_socall.py --weights weights_30.pt --device cuda --chunk 4800 --overlap 0 --batch 64 --npy data/D1/sample.npz --decode-mode python --warmup 1 --min-seconds 60 --out <tag>.fastq --stats-json run-stats_<tag>.json --runs-csv runs.csv --timing timing.csv; sudo tegrastats --stop; python3 tegra_summary.py <log> --idle-mw 3292 (30 s pause between runs, variants run round-robin)",
