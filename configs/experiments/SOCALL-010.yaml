  "command": "sudo jetson_clocks; per process run: sudo tegrastats --interval 1000 --logfile <abs>/tegrastats_<tag>.log --start; python3 run_socall_v2.py --weights weights_30.pt --device cuda --chunk 4800 --overlap 0 --batch 64 --decoder greedy --decode-mode gpu --npy data/D1/sample.npz --warmup 1 --min-seconds 60 --out <tag>.fastq --stats-json run-stats_<tag>.json --runs-csv runs.csv --timing timing.csv; sudo tegrastats --stop; python3 tegra_summary.py <log> --idle-mw 3292 (30 s pause between runs)",
  "shell": "bash over SSH via Tailscale (Ubuntu 18.04, L4T R32.7.6)",
  "working_directory": "~/socall on the TX2 (private SoCall files, not public)",
  "environment": {
    "python": "3.6.9",
    "torch": "1.10.0",
    "numpy": "1.13.3",
    "cuda": "10.2",
    "cudnn": "8.2.1 (8201)",
    "l4t": "R32.7.6 (GCID 38171779)",
    "device": "cuda (NVIDIA Tegra X2)",
    "precision": "fp32",
    "power_mode": "MAXN + jetson_clocks",
    "input": "D1 POD5 converted to NPZ (calibrated pA, float32) with pod5_to_npz.py; NPZ SHA-256 6e6d1576b17a76c53406c4ec37964088bce5f30917500972b92ef65ba95a59e5"
  },
  "settings": {
    "chunk_size": 4800,
    "overlap": 0,
    "batch_size": 64,
    "caller_threads": null,
    "beam_size": null
  },
  "warmup_count": 1,
  "measured_run_count": 3,
  "workload_repetitions": 3,
  "timing_scope": "Per-stage wall time inside one process with CUDA synchronization at stage boundaries. Each of 3 process runs: one untimed warm-up pass, then timed passes over all 59 reads until at least 60 s elapsed. Model load and NPZ loading excluded.",
  "telemetry": {
    "timing_method": "time.perf_counter per stage with torch.cuda.synchronize at stage boundaries; per-pass wall time",
    "memory_method": "Process peak RSS (getrusage) and torch.cuda.max_memory_allocated; system RAM from tegrastats",
    "power_method": "tegrastats VDD_IN (INA3221), 1 s interval, one capture per process run incl. setup and warm-up; tegra_summary.py averages",
    "power_scope": "jetson-module-input",
    "sampling_interval_s": 1.0
  },
  "output_format": "FASTQ",
