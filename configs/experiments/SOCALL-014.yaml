  "limitations": [
    "Folded model in FP16 through PyTorch/cuDNN (weights and activations half, log-softmax FP32). Wrapper: fold_socall.py launcher (folds BatchNorm into the convs on load and checks the fold against the unfolded model on the CPU, max abs log-prob diff < 1e-4) around run_socall_v2.py; wrapper, launcher and model code are private.",
    "D1 is R10.4.1 at 5 kHz, out of distribution for SoCall; throughput and power are valid, accuracy is not (see the D5 records).",
    "PyTorch 1.10 runs these FP16 convolutions through cuDNN; an inference-only check in the same session put FP16 at 0.85x of folded FP32. The likely cause (FP32 accumulation without the Pascal half2 rate) is not verified. TensorRT FP16 is a separate study.",
    "Single board and session; no thermal-stability criterion. INA3221 scaling uncalibrated; idle 3.29 W from the jetson-tx2-jp466 system record.",
    "Paths under the run user's home directory were stripped from the published run-stats, stdout and hash files; no other bytes were changed (tegrastats logs gzipped).",
    "Results: mean 0.8416 M samples/s, SD 0.0013, over 6 timed passes in 3 process runs (41.1% of the 2.048 M samples/s 4 kHz target). Stage shares: inference 93.5%, normalize 3.5%, decode 1.2%. CUDA max allocation: 59.7 MiB, 59.7 MiB, 59.7 MiB. run 1: 11.96 W avg VDD_IN (8.67 W above idle), GPU util 80.8%; run 2: 12.01 W avg VDD_IN (8.72 W above idle), GPU util 83.3%; run 3: 12.04 W avg VDD_IN (8.75 W above idle), GPU util 80.8%;"
  ]
