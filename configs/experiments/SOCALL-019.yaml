  "limitations": [
    "BN-folded model run as a TensorRT engine built with --fp16 (TensorRT picks FP16 or FP32 kernels per layer). Wrapper: trt_socall.py launcher (replaces SoCall's forward with a TensorRT 8.2 engine built from the BN-folded model exported to ONNX opset 13, and checks the engine against folded FP32 PyTorch on load) around run_socall_v2.py; wrapper, launcher, model code, ONNX file and engines are private.",
    "D1 is R10.4.1 at 5 kHz, out of distribution for SoCall; throughput and power are valid, accuracy is not (see the D5 records).",
    "Engines built once on the board with trtexec (TensorRT 8.2.1.9, optimisation profile batch 1 to 64 at 1x4800, tuned for 64, 1 GiB workspace); the engine replaces only the network forward pass, normalization, chunking, decoding and stitching are unchanged.",
    "Single board and session; no thermal-stability criterion. INA3221 scaling uncalibrated; idle 3.29 W from the jetson-tx2-jp466 system record.",
    "Paths under the run user's home directory were stripped from the published run-stats, stdout and hash files; no other bytes were changed (tegrastats logs gzipped).",
    "Results: mean 2.0476 M samples/s, SD 0.0024, over 15 timed passes in 3 process runs (99.98% of the 2.048 M samples/s 4 kHz target). Stage shares: inference 84.1%, normalize 8.5%, decode 3.0%, stitch 1.5%. CUDA max allocation (PyTorch allocator only): 17.3 MiB, 17.3 MiB, 17.3 MiB. run 1: 9.34 W avg VDD_IN (6.05 W above idle), GPU util 70.1%; run 2: 9.42 W avg VDD_IN (6.12 W above idle), GPU util 67.7%; run 3: 9.42 W avg VDD_IN (6.13 W above idle), GPU util 66.8%;"
  ]
