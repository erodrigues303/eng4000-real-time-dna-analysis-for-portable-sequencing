  "limitations": [
    "Folded FP32 model on all of D5. Wrapper: fold_socall.py launcher (folds BatchNorm into the convs on load and checks the fold against the unfolded model on the CPU, max abs log-prob diff < 1e-4) around run_socall_v2.py; wrapper, launcher and model code are private.",
