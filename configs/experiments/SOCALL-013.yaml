  "limitations": [
    "BatchNorm folded into the preceding convolutions, FP32 (an exact change). Wrapper: fold_socall.py launcher (folds BatchNorm into the convs on load and checks the fold against the unfolded model on the CPU, max abs log-prob diff < 1e-4) around run_socall_v2.py; wrapper, launcher and model code are private.",
    "D1 is R10.4.1 at 5 kHz, out of distribution for SoCall; throughput and power are valid, accuracy is not (see the D5 records).",
    "Single board and session; no thermal-stability criterion. INA3221 scaling uncalibrated; idle 3.29 W from the jetson-tx2-jp466 system record.",
    "Paths under the run user's home directory were stripped from the published run-stats, stdout and hash files; no other bytes were changed (tegrastats logs gzipped).",
    "Results: mean 0.9972 M samples/s, SD 0.0006, over 9 timed passes in 3 process runs (48.7% of the 2.048 M samples/s 4 kHz target). Stage shares: inference 92.3%, normalize 4.1%, decode 1.5%. CUDA max allocation: 112.4 MiB, 112.4 MiB, 112.4 MiB. run 1: 11.92 W avg VDD_IN (8.63 W above idle), GPU util 81.9%; run 2: 12.03 W avg VDD_IN (8.73 W above idle), GPU util 78.3%; run 3: 12.12 W avg VDD_IN (8.83 W above idle), GPU util 83.9%;"
