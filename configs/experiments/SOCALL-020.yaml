  "limitations": [
    "TensorRT FP32 engine on all of D5. Wrapper: trt_socall.py launcher (replaces SoCall's forward with a TensorRT 8.2 engine built from the BN-folded model exported to ONNX opset 13, and checks the engine against folded FP32 PyTorch on load) around run_socall_v2.py; wrapper, launcher, model code, ONNX file and engines are private.",
    "One timed pass after a 50-read warm-up; FAST5 reading and pA conversion are inside the timed pass (read_io). Greedy decoding only: fast-ctc-decode has no Python 3.6 aarch64 build.",
    "Engines built once on the board with trtexec (TensorRT 8.2.1.9, optimisation profile batch 1 to 64 at 1x4800, tuned for 64, 1 GiB workspace); the engine replaces only the network forward pass, normalization, chunking, decoding and stitching are unchanged.",
    "Single board and session; no thermal-stability criterion. INA3221 scaling uncalibrated; idle 3.29 W from the jetson-tx2-jp466 system record.",
