    "D1 is R10.4.1 at 5 kHz; SoCall was trained on R9.4.1 at ~4 kHz (S). Output is about 1 base per 19.5 samples versus ~12.5 expected at 400 b/s, consistent with undercalling. Throughput and power are valid; accuracy is not, and no reference exists for D1.",
