  "limitations": [
    "BN-folded model run as a TensorRT FP32 engine (a cross-runtime exact change). Wrapper: trt_socall.py launcher (replaces SoCall's forward with a TensorRT 8.2 engine built from the BN-folded model exported to ONNX opset 13, and checks the engine against folded FP32 PyTorch on load) around run_socall_v2.py; wrapper, launcher, model code, ONNX file and engines are private.",
    "D1 is R10.4.1 at 5 kHz, out of distribution for SoCall; throughput and power are valid, accuracy is not (see the D5 records).",
    "Engines built once on the board with trtexec (TensorRT 8.2.1.9, optimisation profile batch 1 to 64 at 1x4800, tuned for 64, 1 GiB workspace); the engine replaces only the network forward pass, normalization, chunking, decoding and stitching are unchanged.",
    "Single board and session; no thermal-stability criterion. INA3221 scaling uncalibrated; idle 3.29 W from the jetson-tx2-jp466 system record.",
    "Paths under the run user's home directory were stripped from the published run-stats, stdout and hash files; no other bytes were changed (tegrastats logs gzipped).",
    "Results: mean 1.7641 M samples/s, SD 0.0022, over 12 timed passes in 3 process runs (86.14% of the 2.048 M samples/s 4 kHz target). Stage shares: inference 86.3%, normalize 7.3%, decode 2.6%, stitch 1.2%. CUDA max allocation (PyTorch allocator only): 17.3 MiB, 17.3 MiB, 17.3 MiB. run 1: 8.67 W avg VDD_IN (5.38 W above idle), GPU util 69.4%; run 2: 8.84 W avg VDD_IN (5.54 W above idle), GPU util 74.8%; run 3: 8.89 W avg VDD_IN (5.59 W above idle), GPU util 69.2%;"
  ]
