  "limitations": [
    "Ege's launcher: replaces the python-mode greedy decoder with a numpy version that keeps the original float64 quality math. Wrapper: new_greedy_socall.py launcher around run_socall.py (2026-11-20 version); wrapper and model code are private.",
    "D1 is R10.4.1 at 5 kHz, out of distribution for SoCall; throughput and power are valid, accuracy is not.",
    "Single board and session; no thermal-stability criterion. INA3221 scaling uncalibrated; idle 3.29 W from the jetson-tx2-jp466 system record.",
    "Paths under the run user's home directory were stripped from the published run-stats and stdout files; no other bytes were changed (tegrastats logs gzipped).",
    "Results: mean 0.9464 M samples/s, SD 0.0005, over 9 timed passes in 3 process runs (46.2% of the 2.048 M samples/s 4 kHz target). Stage shares: inference 90.9%, normalize 3.9%, decode 1.9%, stitch 1.8%. rep1 11.93 W avg VDD_IN (8.64 W above idle), GPU util 81.8%; rep2 12.00 W avg VDD_IN (8.71 W above idle), GPU util 82.0%; rep3 12.01 W avg VDD_IN (8.72 W above idle), GPU util 83.0%;"
