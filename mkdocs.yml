site_name: Project 22
site_description: Evidence and engineering for portable nanopore basecalling.
site_url: https://erodrigues303.github.io/eng4000-real-time-dna-analysis-for-portable-sequencing/
repo_url: https://github.com/erodrigues303/eng4000-real-time-dna-analysis-for-portable-sequencing
docs_dir: website/content
site_dir: site-build
theme:
  name: null
  custom_dir: website/theme
hooks:
  - website/generate.py
plugins: []
markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Benchmarking: benchmarking/index.md
  - SoCall: socall/index.md
  - Experiments: experiments/index.md
  - Methodology: docs/methodology.md
  - About: about.md
